author: cosipy tutorial (DC4 26Al)
model_definition:
  class: "AllSkyImage"
  property:
    coordinate: "galactic"
    nside: 16 # must be the nside of the image response (NSIDE_IMAGE in the notebook)
    scheme: "ring"
    energy_edges: # must be the same as the response
      value: [1805.0, 1812.0]
      unit: "keV"
    unit: "cm-2 s-1 sr-1"
  initialization:
    algorithm: "flat"
    parameter:
      value: [1e-5]
      unit: "cm-2 s-1 sr-1"
deconvolution:
  algorithm: "RLadvanced"
  parameter:
    iteration_max: 200
    acceleration:
        activate: True
        algorithm: "MaxStep"
        accel_factor_max: 10.0
        accel_bkg_norm: False
    response_weighting:
        activate: True
        index: 0.5
    smoothing:
        activate: True
        FWHM:
            value: 2.0
            unit: "deg"
    stopping_criteria:
        statistics: "log-likelihood"
        threshold: 0.0 # run all iterations
    background_normalization_optimization:
        activate: True
        range: {"low": [0.5, 2.0], "inst": [0.5, 2.0], "high": [0.5, 2.0]}
    save_results:
        activate: False
        directory: "./results"
        only_final_result: True
